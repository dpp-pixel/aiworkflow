<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ansim-Eum Frontend (React-only)</title>

  <!-- API_BASE 결정: ?api=… > localStorage > http://127.0.0.1:8001 -->
  <script>
    (function () {
      const q  = new URLSearchParams(location.search).get('api');
      const ls = localStorage.getItem('API_BASE_OVERRIDE');
      const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      const fallback = isLocal ? 'http://127.0.0.1:8001' : ''; // 외부 접속 시 상대 URL 사용
      const api = q || ls || fallback;
      Object.defineProperty(window, '__API_BASE__', { value: api, writable: false });

      // 기능 플래그 (React만 사용)
      window.__USE_NEW_UI__   = true;
      window.__SPLIT_CONTEXT__ = true; // 컨텍스트/메인을 분리 렌더하고 싶다면 true
    })();
  </script>

  <style>
    :root { color-scheme: dark; }
    html, body { height:100%; margin:0; }
    body { background:#0f172a; color:#e5e7eb; font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,sans-serif; }
    .frame  { display:grid; grid-template-columns:7fr 3fr; height:100dvh; gap:16px; padding:16px; box-sizing:border-box; }
    .left   { display:grid; grid-template-rows:260px 1fr; gap:16px; min-width:0; }
    .box    { background:#0b1220; border:1px solid #1f2937; border-radius:12px; padding:12px; overflow:hidden; min-height:0; display:flex; flex-direction:column; }
    .menu   { height:36px; display:flex; align-items:center; gap:12px; padding:0 16px; border-bottom:1px solid #1f2937; }
    .badge  { position:fixed;bottom:8px;left:8px;z-index:99999;background:#0b1220;color:#9ca3af;padding:4px 8px;border:1px solid #334155;border-radius:6px;font:12px ui-monospace,monospace; }
    /* 자식 스크롤 허용 및 안전 스타일 */
    #mainPanel, #contextReactRoot { min-height: 0; }
    .box { min-height: 0; display:flex; flex-direction:column; }
  </style>
  <link rel="stylesheet" href="/src/styles/globals.css" />
</head>
<body>

  <!-- 폴더 탐색기 모달 -->
  <div id="folderPickerOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100000;align-items:center;justify-content:center;">
    <div style="background:#0b1220;border:1px solid #334155;border-radius:12px;width:520px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;">
      <div style="padding:12px 16px;border-bottom:1px solid #1f2937;display:flex;align-items:center;gap:8px;">
        <span style="color:#9ca3af;font-size:12px;">폴더 선택</span>
        <button id="fpUpBtn" title="상위 폴더" style="margin-left:auto;background:transparent;border:1px solid #374151;color:#9ca3af;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:13px;">↑ 상위</button>
        <button id="fpClose" style="background:transparent;border:none;color:#6b7280;cursor:pointer;font-size:16px;line-height:1;">✕</button>
      </div>
      <div id="fpPath" style="padding:6px 16px;font:12px ui-monospace,monospace;color:#60a5fa;border-bottom:1px solid #1f2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
      <div id="fpList" style="overflow-y:auto;flex:1;padding:6px 8px;"></div>
      <div id="fpDrives" style="display:none;padding:6px 16px;border-top:1px solid #1f2937;"></div>
      <div style="padding:10px 16px;border-top:1px solid #1f2937;display:flex;justify-content:flex-end;gap:8px;">
        <button id="fpCancel" style="background:transparent;border:1px solid #374151;color:#9ca3af;border-radius:6px;padding:6px 14px;cursor:pointer;">취소</button>
        <button id="fpSelect" style="background:#1d4ed8;border:none;color:#fff;border-radius:6px;padding:6px 16px;cursor:pointer;font-weight:600;">이 폴더 선택</button>
      </div>
    </div>
  </div>

  <!-- 상단 메뉴 (FILE 드롭다운 포함) -->
  <div class="menu" id="menuBar">
    <div class="menuItem" id="menuFile" style="position:relative;cursor:pointer">FILE ▾
      <!-- FILE 드롭다운 -->
      <div id="fileMenu" style="
        position:absolute; left:0; top:100%;
        background:#0b1220; border:1px solid #334155; border-radius:8px;
        box-shadow:0 8px 24px rgba(0,0,0,.35);
        min-width:220px; padding:6px; margin-top:6px; display:none; z-index:10000;
      ">
        <button id="actionNewWs" style="
          width:100%; text-align:left; padding:8px 10px; border-radius:6px;
          background:transparent; color:#e5e7eb; border:none; cursor:pointer;
        ">🆕 New Workspace…</button>
        <button id="actionSetWs" style="
          width:100%; text-align:left; padding:8px 10px; border-radius:6px;
          background:transparent; color:#e5e7eb; border:none; cursor:pointer;
        ">📁 Open Workspace…</button>
        <!-- 추후 항목을 여기에 계속 추가 -->
      </div>
    </div>
    <div class="menuItem">EDIT</div>
    <div class="menuItem">VIEW</div>
    <div style="margin-left:auto;opacity:.6">Ansim-Eum Frontend</div>
  </div>

  <!-- 7:3 레이아웃: 좌(컨텍스트/메인), 우(로그) -->
  <main class="frame">
    <section class="left">
      <!-- ✅ 컨텍스트 React 마운트 -->
      <div id="contextReactRoot" class="box"></div>
      <!-- ✅ 메인 React 마운트: main.jsx가 이 id를 찾습니다 -->
      <div id="mainPanel" class="box"></div>
    </section>
    <!-- 필요하면 로그도 React로 만들 수 있음 -->
    <aside id="logRoot" class="box"></aside>
  </main>

  <!-- 데스크톱 런처가 호출할 수 있는 헬퍼 (선택) -->
  <script>
    window.refreshFiles = async function() { /* ContextPanel에서 훅으로 연결해 사용 가능 */ };
    window.renderCtxPicker = function() { /* 필요 시 구현 */ };
  </script>

  <!-- 디버그 배지: 현재 API 표시 -->
  <script>
    (function () {
      const b=document.createElement('div');
      const mode=(window.pywebview && window.pywebview.api)?'desktop':'web';
      b.className='badge'; b.textContent=`mode=${mode} | API=${window.__API_BASE__}`;
      document.body.appendChild(b);
    })();
  </script>

  <!-- ✅ React 엔트리 동적 임포트: main.jsx / context.jsx -->
  <script type="module">
    async function tryPath(p) {
      try {
        console.info("[loader] import", p);
        await import(/* @vite-ignore */ p);
        console.info("[loader] OK", p);
        return true;
      } catch (e) {
        console.warn("[loader] FAIL", p, e?.message || e);
        return false;
      }
    }

    async function loadOne(logicalName, candidates) {
      for (const p of candidates) {
        if (await tryPath(p)) return true;
      }
      console.error(`[loader] ${logicalName} not found in any candidate paths`);
      // 화면에서 바로 보이게 경고
      const warn = document.createElement("div");
      warn.style.cssText = "position:fixed;top:48px;left:16px;padding:8px 10px;background:#7f1d1d;border:1px solid #fecaca;color:#fee2e2;border-radius:8px;z-index:99999";
      warn.textContent = `⚠ ${logicalName} 모듈을 찾을 수 없습니다. (콘솔 확인)`;
      document.body.appendChild(warn);
      return false;
    }

    // 서버마다 정적 경로가 달라질 수 있어 공통 후보를 모두 시도
    const MAIN_CANDIDATES = [
      "/src/main.jsx", "./src/main.jsx", "src/main.jsx",
      "/assets/src/main.jsx", "/static/src/main.jsx"
    ];
    const CTX_CANDIDATES  = [
      "/src/context.jsx", "./src/context.jsx", "src/context.jsx",
      "/assets/src/context.jsx", "/static/src/context.jsx"
    ];

    // 필수: 메인 먼저
    const okMain = await loadOne("main.jsx", MAIN_CANDIDATES);

    // 선택: 분리 모드면 컨텍스트
    if (window.__SPLIT_CONTEXT__) {
      await loadOne("context.jsx", CTX_CANDIDATES);
    }

    // 로그 패널
    await loadOne("log.jsx", ["/src/log.jsx", "./src/log.jsx", "src/log.jsx"]);
  </script>

  <script>
    (function () {
      const menuFile = document.getElementById('menuFile');
      const fileMenu = document.getElementById('fileMenu');
      const btnNewWs = document.getElementById('actionNewWs');
      const btnSetWs = document.getElementById('actionSetWs');
      const inputDir = document.getElementById('dirPicker');

      // 메뉴 토글
      function toggleMenu(show) {
        fileMenu.style.display = show ? 'block' : 'none';
      }
      menuFile.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMenu(fileMenu.style.display === 'none');
      });
      document.addEventListener('click', () => toggleMenu(false));
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') toggleMenu(false);
      });

      // 공용 fetch 래퍼
      const API = window.__API_BASE__ || '';
      async function api(path, init) {
        const res = await fetch(API + path, {
          headers: { ...(init?.body instanceof FormData ? {} : {'Content-Type':'application/json'}) },
          ...init,
        });
        if (!res.ok) throw new Error(`${res.status} ${path}`);
        const ct = res.headers.get('content-type') || '';
        return ct.includes('application/json') ? res.json() : res.text();
      }

      // 여러 엔드포인트를 순차 시도하는 헬퍼
      async function tryEndpoints(seq) {
        for (const { url, init } of seq) {
          try {
            const r = await fetch(url, init);
            if (r.ok) return { ok: true, res: r };
          } catch {}
        }
        return { ok: false };
      }

      // 1) 데스크톱 브리지: 네이티브 폴더 선택
      async function setWorkspaceViaDesktop() {
        const bridge = window.pywebview?.api;
        const pick = bridge?.pick_workspace || bridge?.pickWorkspace;
        if (!pick) return { ok: false, reason: 'no-desktop-bridge' };

        try {
          const sel = await pick(); // { path: "C:/.../test_workspace" } 또는 문자열
          const path = (typeof sel === 'string') ? sel : sel?.path;
          if (!path) return { ok: false, reason: 'no-path' };

          const headers = { 'Content-Type': 'application/json' };
          const body = JSON.stringify({ path });

          // 서버가 가진 "열기/설정" 엔드포인트 후보들을 순차 시도
          const setOk = await tryEndpoints([
            { url: `${API}/workspace/set`, init: { method: 'POST', headers, body } },
            { url: `${API}/project/open`, init: { method: 'POST', headers, body } },
            { url: `${API}/workspace/open`, init: { method: 'POST', headers, body } },
            { url: `${API}/workspace/set?path=${encodeURIComponent(path)}`, init: { method: 'GET' } },
            { url: `${API}/project/open?path=${encodeURIComponent(path)}`, init: { method: 'GET' } },
          ]);
          if (!setOk.ok) return { ok: false, reason: 'no-matching-endpoint' };

          // 인덱싱/스캔도 가능한 쪽으로 시도
          await tryEndpoints([
            { url: `${API}/workspace/scan`, init: { method: 'POST', headers, body: '{}' } },
            { url: `${API}/project/scan`, init: { method: 'POST', headers, body: '{}' } },
            { url: `${API}/scan`, init: { method: 'POST', headers, body: '{}' } },
          ]);

          return { ok: true, workspace: path };
        } catch (e) {
          return { ok: false, reason: String(e) };
        }
      }

      // 2) Chromium: File System Access API (현재 사용 안 함 - 서버에 /workspace/upload 없음)
      // async function setWorkspaceViaFSAccess() { ... }

      // 3) 범용: <input type="file" webkitdirectory> (현재 사용 안 함 - 서버에 /workspace/upload 없음)
      // function setWorkspaceViaInput() { ... }

      async function scanWorkspace() {
        try { await api('/workspace/scan', { method: 'POST', body: '{}' }); } catch {}
        try { await window.refreshFiles?.(); } catch {}
      }

      function toast(msg, ok = true) {
        const el = document.createElement('div');
        el.textContent = msg;
        el.style.cssText =
          `position:fixed;top:56px;right:16px;padding:10px 12px;
           border-radius:8px;border:1px solid ${ok ? '#4ade80' : '#fca5a5'};
           background:${ok ? '#052e1f' : '#7f1d1d'};color:#e5e7eb;
           z-index:99999; font:13px ui-monospace,monospace`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1800);
      }

      async function setWorkspace() {
        fileMenu.style.display = 'none';
        toast('Opening folder…');

        // 데스크톱 브리지를 통해 폴더 선택
        if (window.pywebview?.api) {
          const r = await setWorkspaceViaDesktop();
          if (!r.ok) {
            toast(`❌ Failed: ${r.reason || 'unknown'}`, false);
            alert('워크스페이스 설정 실패: ' + (r.reason || 'unknown'));
            return;
          }
          // 뷰 갱신
          window.dispatchEvent(new CustomEvent('workspace-changed', { detail: { workspace: r.workspace } }));
          toast(`✅ Workspace set: ${r.workspace}`);
          setTimeout(() => location.reload(), 250);
          return;
        }

        // 브라우저 모드: 서버 파일시스템 탐색기 모달
        openFolderPicker();
      }

      // New Workspace: 나중에 구현 예정
      async function newWorkspace() {
        fileMenu.style.display = 'none';
        toast('⚠ Coming soon…');
        alert('New Workspace 기능은 나중에 추가될 예정입니다.');
      }

      // FILE 메뉴 항목에 바인딩
      btnNewWs?.addEventListener('click', newWorkspace);
      btnSetWs?.addEventListener('click', setWorkspace);

      // 단축키 CTRL/CMD+O
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
          e.preventDefault(); setWorkspace();
        }
      });

      // 메뉴에서 밖으로 포커스 이동 시 닫기(접근성 개선)
      fileMenu.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') toggleMenu(false);
      });
    })();
  </script>

  <!-- Browser upload not supported (no /workspace/upload endpoint)
  <input id="dirPicker" type="file" style="display:none"
    webkitdirectory directory multiple />
  -->

  <script>
    (function () {
      const overlay  = document.getElementById('folderPickerOverlay');
      const fpPath   = document.getElementById('fpPath');
      const fpList   = document.getElementById('fpList');
      const fpDrives = document.getElementById('fpDrives');
      const fpUpBtn  = document.getElementById('fpUpBtn');
      const fpSelect = document.getElementById('fpSelect');
      const fpCancel = document.getElementById('fpCancel');
      const fpClose  = document.getElementById('fpClose');
      const API = window.__API_BASE__ || '';

      let currentPath = '';
      let resolveCallback = null;

      async function loadDir(path) {
        fpList.innerHTML = '<div style="padding:16px;color:#6b7280;text-align:center">불러오는 중…</div>';
        try {
          const res = await fetch(`${API}/workspace/browse?path=${encodeURIComponent(path)}`);
          if (!res.ok) throw new Error(res.status);
          const data = await res.json();
          currentPath = data.path;
          fpPath.textContent = data.path;
          fpUpBtn.disabled = !data.parent;
          fpUpBtn.style.opacity = data.parent ? '1' : '0.3';
          fpUpBtn.onclick = () => data.parent && loadDir(data.parent);

          // 드라이브 목록 (루트에서만)
          if (data.drives && data.drives.length) {
            fpDrives.style.display = 'flex';
            fpDrives.style.gap = '6px';
            fpDrives.style.flexWrap = 'wrap';
            fpDrives.innerHTML = data.drives.map(d =>
              `<button onclick="window._fpLoadDir('${d.replace(/\\/g,'\\\\')}')" style="background:#1e293b;border:1px solid #374151;color:#94a3b8;border-radius:4px;padding:2px 10px;cursor:pointer;font:12px ui-monospace,monospace">${d}</button>`
            ).join('');
          } else {
            fpDrives.style.display = 'none';
          }

          if (!data.items.length) {
            fpList.innerHTML = '<div style="padding:16px;color:#6b7280;text-align:center">하위 폴더 없음</div>';
            return;
          }
          fpList.innerHTML = data.items.map(item => `
            <div onclick="window._fpLoadDir('${item.path.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}') "
              style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;color:#e5e7eb;"
              onmouseover="this.style.background='#1e293b'" onmouseout="this.style.background='transparent'">
              <span style="font-size:15px;">📁</span>
              <span style="font:13px ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${item.name}</span>
            </div>`).join('');
        } catch(e) {
          fpList.innerHTML = `<div style="padding:16px;color:#f87171;text-align:center">오류: ${e.message}</div>`;
        }
      }

      window._fpLoadDir = (p) => loadDir(p);

      function openFolderPicker() {
        overlay.style.display = 'flex';
        loadDir('');
      }

      function closePicker() {
        overlay.style.display = 'none';
        currentPath = '';
      }

      fpClose.onclick  = closePicker;
      fpCancel.onclick = closePicker;
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closePicker(); });

      fpSelect.onclick = async () => {
        if (!currentPath) return;
        try {
          const res = await fetch(`${API}/workspace/set`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: currentPath }),
          });
          if (!res.ok) throw new Error(res.status);
          closePicker();
          window.dispatchEvent(new CustomEvent('workspace-changed', { detail: { workspace: currentPath } }));
          const el = document.createElement('div');
          el.textContent = `✅ Workspace set: ${currentPath}`;
          el.style.cssText = 'position:fixed;top:56px;right:16px;padding:10px 12px;border-radius:8px;border:1px solid #4ade80;background:#052e1f;color:#e5e7eb;z-index:99999;font:13px ui-monospace,monospace';
          document.body.appendChild(el);
          setTimeout(() => { el.remove(); location.reload(); }, 1500);
        } catch(e) {
          const el = document.createElement('div');
          el.textContent = `❌ 설정 실패: ${e.message}`;
          el.style.cssText = 'position:fixed;top:56px;right:16px;padding:10px 12px;border-radius:8px;border:1px solid #fca5a5;background:#7f1d1d;color:#e5e7eb;z-index:99999;font:13px ui-monospace,monospace';
          document.body.appendChild(el); setTimeout(() => el.remove(), 2500);
        }
      };

      window.openFolderPicker = openFolderPicker;
    })();
  </script>
</body>
</html>
